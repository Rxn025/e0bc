name: Windows LiteManager Setup

on:
  workflow_dispatch:  # manual trigger

jobs:
  lite-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Lite Manager Server
        run: |
          Invoke-WebRequest "https://www.litemanager.com/download/LiteManagerServer.zip" -OutFile "LiteManagerServer.zip"
          Expand-Archive LiteManagerServer.zip -DestinationPath C:\LiteManager

      - name: Install Lite Manager silently
        run: |
          Start-Process "C:\LiteManager\LiteManagerServer.exe" "/S" -Wait

      - name: Start Lite Manager Server
        run: |
          Start-Process "C:\LiteManager\LiteManagerServer.exe" "/start" 

      - name: Show IP info
        run: |
          ipconfig
